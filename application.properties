spring.application.name=AIResumeanalyzer
spring.profiles.active = dev

#Database connections
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:airesume}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Chandu@1502}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hikari connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-secret-in-prod-to-a-long-random-base64-string} 
app.jwt.access-token-expiration-ms=900000 
app.jwt.refresh-token-expiration-ms=604800000

#File upload configuration
app.file.max-size-mb=5
app.file.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document

#Actuator
management.endpoints.web.exposure.include=health,info,metrics

#Logging
logging.level.root=INFO
logging.level.com.chandu.resumeanalyzer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
